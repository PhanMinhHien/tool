    <script>
      const form = document.getElementById('uploadForm');
      const statusText = document.getElementById('status');
      const screenshotInput = document.getElementById('screenshotInput');
      const folderInput = document.getElementById('folderInput');
      const uploadTypeInput = document.getElementById('uploadType');
      const bannerNameContainer = document.getElementById('bannerNameContainer');
      const bannerImageNameInput = document.getElementById('bannerImageNameInput');
      let detectedSalesOrg = null;
      let detectedLangCode = null;
      const idTicketInput = document.querySelector("#idTicket");
      const bannerNameInput = document.querySelector("#bannerImageNameInput");
      const typeBannerInput = document.querySelector("#typeBanner");
      const campaignNameInput = document.querySelector("#campaignName");
      let currentWeek = "";

      function updateImageName() {

        const week = currentWeek.trim();
        const type = typeBannerInput.value.trim();
        const campaign = campaignNameInput.value.trim();
        const idTicket = idTicketInput.value.trim();

        if (!week || !type || !campaign) return;

        bannerNameInput.value =
          `${week}_${type}_${campaign}_${idTicket}`.trim();
      }

      idTicketInput.addEventListener("input", updateImageName);
      campaignNameInput.addEventListener("input", updateImageName);
      typeBannerInput.addEventListener("change", updateImageName);
      bannerImageNameInput.addEventListener('input', () => {
        const val = bannerImageNameInput.value.trim();
        if (val.length >= 2) {

          let countryCode = "";


          const patternMatch = val.match(/[_\-]([A-Z]{2})[_\-]/);
          if (patternMatch) {
            countryCode = patternMatch[1];
          }


          if (!countryCode) {
            const digitLetterMatch = val.match(/\d([A-Z]{2})_/);
            if (digitLetterMatch) {
              countryCode = digitLetterMatch[1];
            }
          }


          if (!countryCode) {
            const langInput = document.getElementById("languageInput");
            if (langInput && langInput.value) {
              countryCode = langInput.value.trim().toUpperCase().slice(0, 2);
            }
          }


          if (!countryCode && /^[A-Z]{2}/.test(val)) {
            countryCode = val.slice(0, 2);
          }

          if (countryCode && /^[A-Z]{2}$/.test(countryCode)) {
            folderInput.value = countryCode;
          }


          const weekMatch = val.match(/W(\d+)/i);
          if (weekMatch) {
            currentWeek = `W${weekMatch[1]}`;
          }
          folderInput.dispatchEvent(new Event("input", { bubbles: true }));
        }
      });

      function handleUploadTypeChange() {
        const uploadType = uploadTypeInput.value;
        localStorage.setItem('selectedUploadType', uploadType);
        if (uploadType === 'banners') {
          folderInput.readOnly = true;
          bannerNameContainer.style.display = 'block';
          bannerImageNameInput.setAttribute('required', 'true');
          const val = bannerImageNameInput.value.trim();
          if (val.length >= 2) {


            folderInput.dispatchEvent(new Event("input", { bubbles: true }));
          }
        } else {
          folderInput.readOnly = false;
          folderInput.value = '';
          bannerNameContainer.style.display = 'none';
          bannerImageNameInput.removeAttribute('required');
          bannerImageNameInput.value = '';

          detectedSalesOrg = null;
          detectedLangCode = null;
        }
      }
      uploadTypeInput.addEventListener('change', handleUploadTypeChange);
      const savedUploadType = localStorage.getItem('selectedUploadType');
      if (savedUploadType) {
        uploadTypeInput.value = savedUploadType;
        handleUploadTypeChange();
      }
      document.addEventListener('paste', async (e) => {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (item.type.indexOf("image") === 0) {
            const file = item.getAsFile();
            if (file) {
              screenshotInput.files = createFileList(file);
              updatePreview(file);
              break;
            }
          }
        }
      });
      function createFileList(file) {
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        return dataTransfer.files;
      }
      function updatePreview(file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          const oldPreview = document.getElementById("imgPreview");
          if (oldPreview) {
            oldPreview.remove();
          }
          const imgPreview = document.createElement("img");
          imgPreview.src = reader.result;
          imgPreview.id = 'imgPreview';
          const container = document.querySelector('.container');
          container.appendChild(imgPreview);
        };
        reader.readAsDataURL(file);
      }

let screenshotRootHandle = null;

async function getScreenshotFolder() {
  try {
    // Chọn thư mục gốc nếu chưa chọn
    if (!screenshotRootHandle) {
      screenshotRootHandle = await window.showDirectoryPicker({
        id: 'screenshot-saver',
        mode: 'readwrite',
        startIn: 'documents'
      });
    }

    // Kiểm tra quyền ghi
    let permission = await screenshotRootHandle.queryPermission({
      mode: 'readwrite'
    });

    if (permission !== 'granted') {
      permission = await screenshotRootHandle.requestPermission({
        mode: 'readwrite'
      });
    }

    if (permission !== 'granted') {
      throw new Error('Folder permission denied.');
    }

    return screenshotRootHandle;

  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
    }
    throw err;
  }
}

// Tạo thư mục con theo đường dẫn
async function getNestedFolder(root, paths) {
  let current = root;

  for (const path of paths) {
    current = await current.getDirectoryHandle(path, {
      create: true
    });
  }

  return current;
}

// Ghi ảnh vào thư mục
async function saveImageToFolder(folder, fileName, file) {
  const fileHandle = await folder.getFileHandle(fileName, {
    create: true
  });

  const writable = await fileHandle.createWritable();

  await writable.write(file);
  await writable.close();
}
      form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const file = screenshotInput.files[0];
  const folderName = folderInput.value.trim();
  const uploadType = uploadTypeInput.value;

  const imageName = uploadType === 'banners'
    ? bannerImageNameInput.value.trim()
    : 'Statistic';

  if (
    !file ||
    !folderName ||
    !uploadType ||
    (uploadType === 'banners' && !imageName)
  ) {
    alert('Please paste or select a screenshot and enter required information.');
    return;
  }

  try {
    statusText.textContent = 'Saving image...';
    statusText.style.color = 'orange';

    // Chọn thư mục gốc
    const root = await getScreenshotFolder();

    let targetFolder;
    let finalFileName;

    if (uploadType === 'newsletter') {

      // Newsletter / Week N / Country / Folder
      const now = new Date();

      // ISO week
      const date = new Date(Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      ));

      const day = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - day);

      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));

      const weekNumber = Math.ceil(
        (((date - yearStart) / 86400000) + 1) / 7
      );

      const weekFolder = `Week ${weekNumber}`;

      // Xác định quốc gia theo Sales Org
      const countryMap = {
        '2800': 'DK',
        '2900': 'NO',
        '3100': 'SE',
        '5710': 'FI'
      };

      const country = countryMap[detectedSalesOrg] || 'Other';

      targetFolder = await getNestedFolder(root, [
        'uploads',
        'Newsletter',
        weekFolder,
        country,
        folderName
      ]);

      finalFileName = 'Statistic' + getImageExtension(file);

    } else if (uploadType === 'banners') {

      // Banners Upload / Week N / Folder
      const weekMatch = imageName.match(/W(\d+)/i);

      if (!weekMatch) {
        alert('Image name must contain a week number, e.g. W45.');
        statusText.textContent = '';
        return;
      }

      const weekFolder = `Week ${weekMatch[1]}`;

      targetFolder = await getNestedFolder(root, [
        'uploads',
        'Banners Upload',
        weekFolder,
        folderName
      ]);

      finalFileName = imageName + getImageExtension(file);
    }

    // Lưu ảnh
    await saveImageToFolder(
      targetFolder,
      finalFileName,
      file
    );

    statusText.textContent = `Saved successfully: ${finalFileName}`;
    statusText.style.color = 'green';

  } catch (err) {
    console.error(err);

    if (err.name === 'AbortError') {
      statusText.textContent = 'Folder selection cancelled.';
    } else {
      statusText.textContent = 'Save failed: ' + err.message;
    }

    statusText.style.color = 'red';
  }
});

// Lấy phần mở rộng của ảnh
function getImageExtension(file) {
  const extension = file.name.match(/\.[^/.]+$/);
  return extension ? extension[0] : '.png';
}

      function getCurrentWeek() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        const diff =
          now - start + (start.getTimezoneOffset() - now.getTimezoneOffset()) * 60000;
        const oneWeek = 604800000;
        return String(Math.ceil(diff / oneWeek)).padStart(2, "0");
      }
      function getMMDD() {
        const now = new Date();
        const mm = String(now.getMonth() + 1).padStart(2, "0");
        const dd = String(now.getDate()).padStart(2, "0");
        return mm + dd;
      }

function parseCampaignInfo(rawCampaign) {
  // Find the first pair of *...*
  const markerMatch = rawCampaign.match(/\*([^*]*)\*/);

  let campaignID = "";

  if (markerMatch) {
    campaignID = markerMatch[1].trim();

    // Keep everything before the opening *
    // Append the content inside *...*
    // Remove everything after the closing *
    rawCampaign =
      rawCampaign.slice(0, markerMatch.index) +
      " " +
      campaignID;
  } else {
    // Remove date if there is no *...* marker
    rawCampaign = rawCampaign
      .replace(/\b\d{4}-\d{2}-\d{2}\b/, "")
      .trim();
  }

  let mainPart = rawCampaign
    .split("-")
    .slice(1)
    .join("-")
    .trim();

  mainPart = mainPart
    .replace(/[-_]/g, " ")
    .replace(/\b5710 ALSO Finland Oy\b/i, "5710")
    .replace(/\s{2,}/g, " ")
    .trim();

  console.log("🧹 Main part after cleaning:", mainPart);

  const tokens = mainPart.split(/\s+/).filter(Boolean);

  const codeToken = tokens.find((t) => /^\d{4}$/.test(t));
  const langCode = getLangFromSalesOrg(codeToken);

  let campaign = tokens.join(" ").trim();

  campaign = campaign
    .split(/\s+/)
    .map((word) => {
      if (
        /\d/.test(word) ||
        /^[A-Z0-9]+$/.test(word) ||
        /[^a-zA-Z0-9]/.test(word)
      ) {
        return word;
      }

      return word.charAt(0).toUpperCase() +
        word.slice(1).toLowerCase();
    })
    .join(" ")
    .trim();

  console.log("🎯 Final:", { campaign, campaignID, langCode });

  return {
    langCode: langCode || "",
    vendor: "",
    campaign,
    campaignID,
  };
}

      function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return String(weekNo).padStart(2, "0");
      }

      function parseSalesOrgAndLangCode(input) {

        const salesOrgMatch = input.match(/[-|:]\s*(\d{4})/);

        if (!salesOrgMatch) {
          console.log("⚠ Không tìm thấy salesOrg trong:", input);
          return { salesOrg: null, langCode: null };
        }

        const salesOrg = salesOrgMatch[1];

        const salesOrgToLang = {
          "2800": "GB",
          "2900": "IE",
          "5410": "PL",
          "5710": "FI",
          "5720": "SE",
          "5730": "DK",
          "5750": "NO",
          "5780": "IS"
        };

        const langCode = salesOrgToLang[salesOrg] || null;

        return { salesOrg, langCode };
